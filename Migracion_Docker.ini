#/*
#* Información general del plan
#	- Proyecto: CNP
#	- Fecha base: 2026-02-24
#	- Período documentado de investigación/configuración/preparación: 2026-02-24 al 2026-03-03
#	- Fecha de inicio operativo de Sprints: 2026-03-04
#	- Duración de ejecución operativa: 5 semanas
#	- Cadencia: 5 días hábiles por Sprint
#	- Modelo: 1 fase previa (completada) + 5 Sprints, 1 semana por Sprint

#* Objetivo general
#	- Migrar frontend, backend y proxy a Docker con despliegue controlado por entorno.
#	- Asegurar seguridad mínima, observabilidad, rollback y continuidad operativa.
#	- Mantener SQL Server institucional como motor obligatorio y no reemplazable.

#* Alcance incluido
#	- Backend Node/TypeScript en contenedor.
#	- Frontend React/Vite con build reproducible y entrega estática.
#	- Proxy reverso para /cnp, /api y /socket.io.
#	- Gestión de secretos fuera del repositorio.
#	- Pipeline CI/CD para build, scan y empaquetado local de imágenes.
#	- Despliegue progresivo DEV -> STAGING -> PRODUCCIÓN.
#	- Uso obligatorio de SQL Server institucional como único motor de base de datos.

#* No alcance
#	- Reescritura de lógica de negocio.
#	- Cambio de SQL Server por otro motor.
#	- Rediseño funcional completo de frontend.

#* Reglas obligatorias de ejecución
#	- Ningún cambio de producción sin evidencia previa en STAGING.
#	- Ningún secreto productivo versionado en repositorio.
#	- Ninguna salida de Sprint sin validar su Definition of Done (DoD).
#	- Prohibido introducir motores alternos (SQLite, PostgreSQL, MySQL, etc.).
#	- Regla de comentado por avance: cuando un punto hijo se complete, se marca con prefijo #.
#	- Regla de cierre de padre: cuando todos los hijos de un padre estén en #, se comenta el punto padre con #.
#	- Regla de cierre de bloque: cuando un bloque se complete (por ejemplo Sprint), se comentan también objetivos, estrategias y requisitos relacionados.
#	- Regla de trazabilidad: todo comentado con # debe tener evidencia en docs/migracion/ejecucion y validación del usuario con la palabra Confirmado.

#* Supuestos
#	- SQL Server institucional y SMTP se consumen como servicios externos.
#	- La entrega inicial a infraestructura se realiza con imágenes exportadas en archivos tar.
#	- Seguridad aprueba mecanismo institucional de secretos.
#	- Redes habilita conectividad necesaria entre contenedores y servicios externos.

#* Dependencias externas
#	- Certificados TLS.
#	- DNS y reglas de firewall.
#	- Credenciales SQL para VALIDACION, CONSULTA y RECEPCION.
#	- Ventanas de cambio autorizadas.
#	- Coordinación con infraestructura para despliegue controlado en c1491.

#* Riesgos iniciales y mitigación
#	- Rutas Windows hardcodeadas.
#		- Mitigación: parametrizar rutas y usar rutas relativas.
#	- Uso de localhost hardcodeado.
#		- Mitigación: centralizar variables por entorno.
#	- Secretos en .env versionados.
#		- Mitigación: migrar a secreto gestionado por plataforma.
#	- Uploads temporales en filesystem local.
#		- Mitigación: definir volumen temporal y limpieza.
#	- WebSocket detrás de proxy en /cnp.
#		- Mitigación: pruebas dedicadas de handshake y reconexión en STAGING.
#	- Riesgo de conectividad a SQL Server institucional.
#		- Mitigación: ventana de pruebas coordinada con DBA/redes y bloqueo de despliegue si falla.

#* Métricas de control
#	- Cumplimiento de backlog por Sprint.
#	- Tiempo promedio de build por servicio.
#	- Tamaño de imagen por servicio.
#	- Latencia p95 de endpoints críticos.
#	- Error rate 5xx por entorno.
#	- Disponibilidad de servicios en STAGING y PROD.
#	- Incidentes críticos en hypercare.
#*/

