name: CI
on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install
        run: |
          cd backend
          npm ci
      - name: Typecheck
        run: |
          cd backend
          npm run typecheck
      - name: Run tests
        run: |
          cd backend
          npm test --silent
      - name: Audit dependencies
        run: |
          cd backend
          npm audit --audit-level=moderate || true
