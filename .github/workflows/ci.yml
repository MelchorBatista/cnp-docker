name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar archivo critico de migracion
        run: |
          if [ ! -f "Migracion_Docker.ini" ]; then
            echo "ERROR: Falta el archivo critico Migracion_Docker.ini"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: |
          cd backend
          npm ci
      - name: Typecheck
        run: |
          cd backend
          npm run typecheck
      - name: Run tests
        run: |
          cd backend
          npm test --silent
      - name: Audit dependencies
        run: |
          cd backend
          npm audit --audit-level=moderate || true

  docker-build-scan-package-dev:
    name: Docker Build Scan Package DEV (B.2.2.2)
    runs-on: ubuntu-latest
    needs:
      - build-and-test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Provisionar toolchain seguridad runner Docker CI
        shell: pwsh
        run: |
          .\scripts\migracion\provisionar_toolchain_seguridad_runner_ci_docker.ps1
      - name: Verificar toolchain seguridad runner Docker CI
        shell: pwsh
        run: |
          .\scripts\migracion\verificar_toolchain_seguridad_runner_ci_docker.ps1
      - name: Ejecutar pipeline base Docker DEV CI
        shell: pwsh
        run: |
          .\scripts\migracion\ejecutar_pipeline_base_docker_dev_ci.ps1 -ExigirHerramientasLocales
      - name: Publicar evidencia B.2.2.3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-b223-toolchain-seguridad-runner-docker-ci
          path: |
            docs/migracion/ejecucion/45*.log
      - name: Publicar evidencia B.2.2.2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-b222-pipeline-base-docker-dev-ci
          path: |
            docs/migracion/ejecucion/44*.log
            evidence/docker_dev_ci/**

  baseline-toolchain-runner-ci:
    name: Baseline Toolchain Runner CI (A.2.2.3)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar herramientas base del runner
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\migracion\instalar_herramientas_base_runner_ci.ps1
      - name: Verificar herramientas base del runner
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\migracion\verificar_herramientas_base_runner_ci.ps1
      - name: Publicar evidencia A.2.2.3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-a223-herramientas-base-runner-ci
          path: |
            docs/migracion/ejecucion/11C_Instalacion_Herramientas_Base_Runner_CI_*.log
            docs/migracion/ejecucion/11D_Verificacion_Herramientas_Base_Runner_CI_*.log

  security-toolchain-runner-ci:
    name: Security Toolchain Runner CI (A.2.2.7-A.2.2.8)
    runs-on: windows-latest
    needs:
      - baseline-toolchain-runner-ci
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar toolchain de seguridad
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\migracion\instalar_toolchain_seguridad.ps1
      - name: Verificar toolchain de seguridad
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\migracion\verificar_toolchain_seguridad.ps1
      - name: Publicar evidencia A.2.2.7-A.2.2.8
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-a227-toolchain-seguridad-runner-ci
          path: |
            docs/migracion/ejecucion/05A_Instalacion_Toolchain_Seguridad_*.log
            docs/migracion/ejecucion/05B_Verificacion_Toolchain_Seguridad_*.log
